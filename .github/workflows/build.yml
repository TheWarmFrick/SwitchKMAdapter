name: Build SwitchKMAdapter Firmware

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build USB Host & Wireless UF2 Binaries
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install ARM GCC Toolchain & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake ninja-build python3

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 1.5.1
          path: pico-sdk
          submodules: recursive

      # -------------------------------------------------------------
      # 1. Build USB Host (Pico-PIO-USB on GP2/GP3) Firmware
      # -------------------------------------------------------------
      - name: Configure CMake (USB Host)
        run: |
          cmake -B build-usb-host -G Ninja \
            -DPICO_BOARD=pico_w \
            -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk \
            -DADAPTER_INPUT_BACKEND=USB_HOST \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Firmware (USB Host)
        run: |
          cmake --build build-usb-host --target SwitchKMAdapter
          cp build-usb-host/SwitchKMAdapter.uf2 SwitchKMAdapter-USB-Host.uf2
          ls -lh SwitchKMAdapter-USB-Host.uf2

      # -------------------------------------------------------------
      # 2. Build Wireless Bluetooth (CYW43 Bluepad32) Firmware
      # -------------------------------------------------------------
      - name: Configure CMake (Wireless BT)
        run: |
          cmake -B build-wireless-bt -G Ninja \
            -DPICO_BOARD=pico_w \
            -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk \
            -DADAPTER_INPUT_BACKEND=WIRELESS_BT \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Firmware (Wireless BT)
        run: |
          cmake --build build-wireless-bt --target SwitchKMAdapter
          cp build-wireless-bt/SwitchKMAdapter.uf2 SwitchKMAdapter-Wireless-BT.uf2
          ls -lh SwitchKMAdapter-Wireless-BT.uf2

      # -------------------------------------------------------------
      # 3. Artifact Upload & GitHub Releases
      # -------------------------------------------------------------
      - name: Upload UF2 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwitchKMAdapter-Firmware-Binaries
          path: |
            SwitchKMAdapter-USB-Host.uf2
            SwitchKMAdapter-Wireless-BT.uf2
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SwitchKMAdapter-USB-Host.uf2
            SwitchKMAdapter-Wireless-BT.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
