name: Build SwitchKMAdapter Firmware

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Pico W UF2
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install ARM GCC Toolchain & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake ninja-build python3

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 1.5.1
          path: pico-sdk
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DPICO_BOARD=pico_w \
            -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Firmware
        run: |
          cmake --build build --target SwitchKMAdapter

      - name: Verify UF2 Output
        run: |
          ls -la build/SwitchKMAdapter.uf2
          cp build/SwitchKMAdapter.uf2 SwitchKMAdapter.uf2

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchKMAdapter-uf2
          path: SwitchKMAdapter.uf2
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SwitchKMAdapter.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
